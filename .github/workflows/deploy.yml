name: Deploy to GitHub Pages
#
# NOTE: this currently deploys `legacy-exact-copy/` — a byte-for-byte copy of
# the original app (same minified bundle, only the asset path adjusted for
# this repo's hosting path) — NOT the React rebuild under `src/`. This is
# deliberate: it gives us a live, pixel-perfect reference matching the real
# app's screens/tabs/workflow exactly, to work from and compare against
# while the rebuild is brought up to match. Once the rebuild matches, this
# workflow should switch back to `npm run build` + `dist/`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-exact-copy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
